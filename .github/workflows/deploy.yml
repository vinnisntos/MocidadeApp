name: Deploy Automático para AWS

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # Permite disparar o deploy manualmente pela aba Actions se precisar

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout do Repositório
        uses: actions/checkout@v4

      - name: 2. Configurar SDK do .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 3. Compilar e Publicar o Projeto (Release)
        run: dotnet publish Mocidade015/Mocidade015.csproj -c Release -r linux-x64 --self-contained false -o ./publish

      - name: 4. Preparar Servidor (Parar serviço e limpar pasta)
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            # Para a aplicação (|| true impede que a pipeline quebre caso o serviço já esteja parado)
            sudo systemctl stop vinnisantos.service || true

            # Garante que o diretório existe e pertence ao usuário SSH
            sudo mkdir -p /var/www/vinnisantos
            sudo chown -R ${{ secrets.USERNAME }}:${{ secrets.USERNAME }} /var/www/vinnisantos

            # Limpa os arquivos antigos da pasta para evitar acúmulo de DLLs desnecessárias
            rm -rf /var/www/vinnisantos/*

      - name: 5. Copiar novos arquivos para a VPS (SCP)
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          source: "publish"
          target: "/var/www/vinnisantos"
          strip_components: 1

      - name: 6. Ajustar Permissões e Iniciar o Serviço
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            # Garante permissões corretas de execução
            sudo chown -R ${{ secrets.USERNAME }}:${{ secrets.USERNAME }} /var/www/vinnisantos
            sudo chmod -R 755 /var/www/vinnisantos

            # Inicia o serviço da aplicação
            sudo systemctl start vinnisantos.service

            # Aguarda 2 segundos e valida se a aplicação subiu de fato
            sleep 2
            if sudo systemctl is-active --quiet vinnisantos.service; then
              echo "✅ Serviço vinnisantos.service rodando com sucesso!"
            else
              echo "❌ Falha ao iniciar vinnisantos.service!"
              exit 1
            fi
