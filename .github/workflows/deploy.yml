name: Deploy Automático para AWS

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout do Repositório
        uses: actions/checkout@v4

      - name: 2. Configurar SDK do .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 3. Compilar e Publicar o Projeto (Release)
        run: dotnet publish Mocidade015/Mocidade015.csproj -c Release -r linux-x64 --self-contained false -o ./publish

      - name: 4. Criar pasta temporária no servidor (SSH)
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            mkdir -p /home/ubuntu/app-deploy-temp
            rm -rf /home/ubuntu/app-deploy-temp/*

      - name: 5. Enviar arquivos para pasta temporária (SCP)
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          source: "publish/*"
          target: "/home/ubuntu/app-deploy-temp"
          strip_components: 1

      - name: 6. Atualizar a aplicação e Reiniciar o Serviço (SSH)
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            # Parar serviço e garantir que o processo encerrou
            sudo systemctl stop vinnisantos.service || true
            sudo pkill -9 -f Mocidade015.dll || true

            # Limpar a pasta do site
            sudo mkdir -p /var/www/vinnisantos
            sudo rm -rf /var/www/vinnisantos/*

            # Copiar arquivos da staging area para /var/www/vinnisantos
            sudo cp -r /home/ubuntu/app-deploy-temp/* /var/www/vinnisantos/
            rm -rf /home/ubuntu/app-deploy-temp

            # Permissões finais
            sudo chown -R ubuntu:ubuntu /var/www/vinnisantos
            sudo chmod -R 755 /var/www/vinnisantos

            # Subir o serviço
            sudo systemctl start vinnisantos.service

            # Validação
            sleep 2
            if sudo systemctl is-active --quiet vinnisantos.service; then
              echo "✅ Deploy concluído com sucesso!"
            else
              echo "❌ Falha ao iniciar vinnisantos.service"
              exit 1
            fi
