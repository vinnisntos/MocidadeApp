name: Deploy Automático para AWS

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout do Repositório
        uses: actions/checkout@v4

      - name: 2. Configurar SDK do .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 3. Compilar e Publicar o Projeto (Release)
        run: dotnet publish Mocidade015/Mocidade015.csproj -c Release -r linux-x64 --self-contained false -o ./publish

      - name: 4. Deploy Direto via Rsync (SSH Nativo)
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          HOST: ${{ secrets.HOST }}
          USER: ${{ secrets.USERNAME }}
        run: |
          # 1. Configura a chave SSH no runner temporário do GitHub
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          # 2. Para a aplicação e prepara o diretório na VPS
          ssh -o StrictHostKeyChecking=no $USER@$HOST "sudo systemctl stop vinnisantos.service || true; sudo mkdir -p /var/www/vinnisantos; sudo chown -R $USER:$USER /var/www/vinnisantos; rm -rf /var/www/vinnisantos/*"

          # 3. Envia os arquivos publicados via Rsync (com logs detalhados)
          rsync -avz -e "ssh -o StrictHostKeyChecking=no" ./publish/ $USER@$HOST:/var/www/vinnisantos/

          # 4. Ajusta permissões, inicia a aplicação e faz o healthcheck
          ssh -o StrictHostKeyChecking=no $USER@$HOST "
            sudo chown -R ubuntu:ubuntu /var/www/vinnisantos
            sudo chmod -R 755 /var/www/vinnisantos
            sudo systemctl start vinnisantos.service
            sleep 2
            if sudo systemctl is-active --quiet vinnisantos.service; then
              echo '✅ Deploy concluído! Aplicação rodando com sucesso.'
            else
              echo '❌ Falha ao iniciar o serviço vinnisantos.service'
              exit 1
            fi
          "
